
interface:
  display_name: "Codex Desktop Loopback Repair"
  short_description: "Repair Codex Desktop proxy, CC-Switch provider, 401, base_url, and 413 errors"
  default_prompt: "Use $ljh-codex-desktop-loopback-repair-skill to diagnose and repair Codex Desktop issues on Windows or macOS. On macOS, when Codex.app reconnects, reports 401, keeps calling an old upstream URL, or config.toml is ignored, use scripts/fix_macos_codex_ccswitch.py with the correct relay/local base URLs to repair config.toml, com.openai.codex.plist config_toml_base64, CC-Switch SQLite provider/backup rows, NO_PROXY, and plist guards, then verify with CC-Switch /v1/responses, codex doctor, and a small codex exec prompt. On Windows, follow the Quick Auto-Fix Flow: stop Codex, diagnose sandbox mode, CC-Switch status, loopback exemption and portproxy, apply Strategy A (sandbox=unelevated + direct CC-Switch connection), recover CC-Switch provider/credentials, and if the user provides an API key/base_url or CC-Switch returns No active credentials/model_not_found, verify upstream /v1/models and configure the exact provider-scoped model such as cx/gpt-5.5 while updating providers, provider_endpoints, proxy_live_backup, and common_config together. Handle 413 by clearing oversized context, ensure portproxy 7897->15721 is active, and verify API tests. Do not fight CC-Switch Live Takeover; it manages base_url and bearer_token."
